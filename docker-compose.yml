version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/reverse_match
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH}
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY}
      - ML_SERVICE_TIMEOUT_MS=${ML_SERVICE_TIMEOUT_MS:-2500}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # BullMQ worker process (Phase 0.7).
  # Shares the same image base as `api` (same node_modules, same src/) but
  # runs `worker.js` instead of `server.js`. Reaches Mongo/Redis via the
  # same compose-network DNS names.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    ports:
      - "${WORKER_METRICS_PORT:-9091}:9091"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/reverse_match
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH}
      - WORKER_METRICS_PORT=9091
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
      - BULLMQ_QUEUE_PREFIX=${BULLMQ_QUEUE_PREFIX:-rm}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/reverse_match
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL:-all-MiniLM-L6-v2}
      - TEXT_EMBED_DIM=${TEXT_EMBED_DIM:-384}
      - CANDIDATES_K=${CANDIDATES_K:-100}
      - TOP_K=${TOP_K:-20}
      - FAISS_NLIST=${FAISS_NLIST:-100}
      - IDEAL_MATCH_MIN_SWIPES=${IDEAL_MATCH_MIN_SWIPES:-20}
      - IDEAL_MATCH_MIN_RIGHT=${IDEAL_MATCH_MIN_RIGHT:-10}
      - EXPLORE_WEIGHT=${EXPLORE_WEIGHT:-0.2}
      - TIME_DECAY_HALF_LIFE=${TIME_DECAY_HALF_LIFE:-7.0}
      - AUTO_REBUILD_ON_BOOT=${AUTO_REBUILD_ON_BOOT:-true}
      - REBUILD_MIN_USERS=${REBUILD_MIN_USERS:-1}
      - CORS_ORIGINS=${ML_CORS_ORIGINS:-*}
      - LOG_LEVEL=${ML_LOG_LEVEL:-INFO}
    volumes:
      - ml_data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
  ml_data:
