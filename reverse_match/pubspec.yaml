name: reverse_match
description: "Reverse Match - Dating app where girls choose first"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  # NOTE: pinned to 2.x — Riverpod 3 migration (StateNotifier → Notifier) is
  # tracked as a Phase 2 task. Do not bump to 3.x without migrating consumers.
  flutter_riverpod: ^2.6.1

  # Navigation
  # NOTE: pinned to 14.x — go_router 17 changed redirect signatures. Migrate
  # intentionally as a Phase 2 task before bumping.
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0
  socket_io_client: ^3.0.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Auth / Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  # NOTE: pinned to 6.x — google_sign_in 7 replaced the constructor with a
  # static `instance` + `authenticate()` flow. Migrate intentionally.
  google_sign_in: ^6.2.2

  # UI
  cached_network_image: ^3.4.1
  flutter_card_swiper: ^7.0.1
  smooth_page_indicator: ^1.2.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  pin_code_fields: ^8.0.1

  # Media
  image_picker: ^1.1.2

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Utility
  intl: ^0.20.2
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  flutter_dotenv: ^5.2.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1

  # Deep links — Stripe Checkout return + share-link routing via reversematch://
  app_links: ^6.1.1

  # Crash reporting
  sentry_flutter: ^8.10.1

  # Generated REST + model layer (Phase 0.2). Path dependency — picked up by
  # `melos bootstrap` since `packages/**` is listed in melos.yaml.
  reverse_match_api:
    path: ../packages/api-client-dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.4
  build_runner: ^2.4.14
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# App icon generation. Run `dart run flutter_launcher_icons` after dropping
# `assets/images/app_icon.png` (1024x1024 PNG, opaque for iOS) +
# `assets/images/app_icon_foreground.png` for the Android adaptive icon.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#E91E8C"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

# Native splash screen. Run `dart run flutter_native_splash:create` after
# dropping `assets/images/splash_logo.png` (recommended 300x300).
flutter_native_splash:
  color: "#E91E8C"
  image: assets/images/splash_logo.png
  android_12:
    color: "#E91E8C"
    icon_background_color: "#E91E8C"
    image: assets/images/splash_logo.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - .env
    - .env.production
    - .env.staging
